name: Scraping Nocturno y Pipeline Cascada - Cafe-sitios

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 03:00 AM (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub Actions

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total_shards: [2]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Caché de Modelos HuggingFace y Embeddings
        uses: actions/cache@v4
        id: models-cache
        with:
          path: |
            ~/.cache/huggingface
            .cache/models
          key: ${{ runner.os }}-hf-models-v1-${{ hashFiles('core/extractor.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-models-v1-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-scraper.txt

      - name: Ejecutar Scraper en Paralelo (Shard ${{ matrix.shard }}/${{ matrix.total_shards }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_DB_MIGRATIONS: "true"
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python scrapper_application.py --shard ${{ matrix.shard }} --total-shards ${{ matrix.total_shards }} --workers 4

