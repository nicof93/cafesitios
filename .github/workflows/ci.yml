name: CI / Quality Gates & Tests

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Pruebas de API REST y Dominio Backend
  backend-api-tests:
    name: Backend API REST & Domain Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas de API REST y Backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python -m unittest discover -s tests/api

  # 2. Pruebas de Scrapers y Drivers ETL
  backend-scrapper-tests:
    name: Backend Scrappers & ETL Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas de Scrapers y Drivers
        env:
          ENVIRONMENT: test
        run: |
          python -m unittest discover -s tests/scrapper

  # 3. Pruebas Unitarias de Frontend (Vitest)
  frontend-unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: astro-frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: astro-frontend
        run: npm ci

      - name: Ejecutar pruebas unitarias de frontend
        working-directory: astro-frontend
        run: npm run test:unit

  # 4. Pruebas End-to-End de Frontend (Playwright)
  frontend-playwright-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: astro-frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: astro-frontend
        run: npm ci

      - name: Instalar navegador Chromium para Playwright
        working-directory: astro-frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E con Playwright
        working-directory: astro-frontend
        run: npm run test:e2e

      - name: Subir reporte de Playwright (solo si falla)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: astro-frontend/playwright-report/
          retention-days: 7
